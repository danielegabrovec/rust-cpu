name: Rust quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NSIS when missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @('C:\Program Files (x86)\NSIS\makensis.exe', 'C:\Program Files\NSIS\makensis.exe')
          if (-not ($paths | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --database test-output/smoke.sqlite3 --save-session CI --samples 2 --snapshot test-output/smoke.json --no-llm
      - run: cargo run --release --locked -- --database test-output/smoke.sqlite3 --db-check
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: rust-cpu-windows-x64
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
